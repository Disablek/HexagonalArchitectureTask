server:
  port: 0
  forward-headers-strategy: framework
spring:
  cloud:
    loadbalancer:
      configurations: weighted
  application:
    name: booking-service
  cache:
    type: redis
  r2dbc:
    username: postgres
    password: pgpwd4habr
    url: r2dbc:postgresql://localhost:5432/booking-service

  grpc:
    server:
      port: 0
    client:
      port-metadata: grpc.port
      channels:
        hotel-service:
          address: discovery:///hotel-service
          negotiation-type: plaintext

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: server.broadcast
      auto-offset-reset: earliest

    producer:
      retries: 5
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      properties:
        enable:
          idempotence: true


resilience4j:
  circuitbreaker:
    instances:
      HOTEL-SERVICE:
        register-health-indicator: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state:
          seconds: 5
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
  retry:
    instances:
      HOTEL-SERVICE:
        max-attempts: 5
        wait-duration:
          seconds: 2

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true
    non-secure-port-enabled: true
    non-secure-port: ${spring.grpc.server.port}
    metadata-map:
      grpc.port: ${spring.grpc.server.port}
      weight: 100


management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs