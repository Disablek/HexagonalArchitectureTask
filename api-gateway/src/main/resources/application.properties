spring.application.name=api-gateway

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

server.port=8082

management.endpoints.web.exposure.include=*

spring.cloud.discovery.enabled=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
server.forward-headers-strategy=framework

grpc.server.port=8080

eureka.instance.non-secure-port=8080
eureka.instance.non-secure-port-enabled=true

#management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
#management.tracing.sampling.probability=1.0

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %-5level --- %msg%n

springdoc.swagger-ui.urls[0].url=/hotel-service/v3/api-docs
springdoc.swagger-ui.urls[0].name=Hotel Service

springdoc.swagger-ui.urls[1].url=/booking-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Booking Service

springdoc.swagger-ui.urls[2].url=/payment-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Payment Service
